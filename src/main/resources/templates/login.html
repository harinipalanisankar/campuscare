<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CampusCare - Sign In</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body style="justify-content: center; align-items: center; background: radial-gradient(circle at top right, #e0e7ff 0%, #f8fafc 60%); padding: 1.5rem;">

    <div class="form-card">
        <div class="form-header">
            <div style="display: inline-flex; align-items: center; justify-content: center; width: 64px; height: 64px; background: linear-gradient(135deg, var(--primary) 0%, #6366f1 100%); color: #ffffff; border-radius: var(--radius-md); font-size: 2rem; margin-bottom: 1.25rem; box-shadow: 0 8px 20px var(--primary-glow);">
                <i class="fa-solid fa-graduation-cap"></i>
            </div>
            <h2>CampusCare</h2>
            <p>Sign in to access your campus grievance workspace</p>
        </div>

        <!-- Error Alert -->
        <div th:if="${param.error != null}" class="alert alert-danger">
            <i class="fa-solid fa-triangle-exclamation"></i>
            <span>Invalid email or password. Please try again.</span>
        </div>

        <form th:action="@{/login}" method="post">
            <div class="form-group">
                <label for="email"><i class="fa-regular fa-envelope" style="margin-right: 0.35rem; color: var(--primary);"></i> Email Address</label>
                <input type="email" id="email" name="email" class="form-control" placeholder="name@campus.edu" required autofocus>
            </div>

            <div class="form-group" style="margin-bottom: 1.85rem;">
                <label for="password"><i class="fa-solid fa-lock" style="margin-right: 0.35rem; color: var(--primary);"></i> Password</label>
                <input type="password" id="password" name="password" class="form-control" placeholder="••••••••" required>
            </div>

            <button type="submit" class="btn-submit">
                <span>Sign In</span>
                <i class="fa-solid fa-arrow-right"></i>
            </button>
        </form>

        <div style="margin-top: 2rem; padding-top: 1.35rem; border-top: 1px solid var(--border-color); text-align: center; font-size: 0.85rem; color: var(--text-muted);">
            <p><i class="fa-solid fa-shield-halved" style="color: var(--primary); margin-right: 0.25rem;"></i> Campus Grievance Management System</p>
        </div>
    </div>

</body>
</html>
