<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CampusCare - Grievance Submitted</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body style="justify-content: center; align-items: center; background: linear-gradient(135deg, #f8fafc 0%, #ecfdf5 100%);">

    <div class="form-card" style="text-align: center; margin: 0; width: 100%; max-width: 480px;">
        <div style="display: inline-flex; align-items: center; justify-content: center; width: 72px; height: 72px; background: #d1fae5; color: #059669; border-radius: 50%; font-size: 2.25rem; margin-bottom: 1.25rem;">
            <i class="fa-solid fa-circle-check"></i>
        </div>

        <h2 style="margin-bottom: 0.75rem;">Grievance Filed Successfully!</h2>
        <p style="color: var(--text-muted); margin-bottom: 1.75rem; font-size: 0.95rem; line-height: 1.5;">
            Your complaint has been logged into the CampusCare resolution pipeline. An administrator will review and assign a technician shortly.
        </p>

        <a href="/user" class="btn-nav" style="width: 100%; justify-content: center; padding: 0.85rem;">
            <i class="fa-solid fa-house"></i>
            <span>Return to Dashboard</span>
        </a>
    </div>

</body>
</html>
